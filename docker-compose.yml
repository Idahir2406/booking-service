  my-service-dev:
    container_name: my-service-dev
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - db
    environment:
      # Dentro del contenedor, localhost es el propio contenedor.
      # host.docker.internal apunta al Mac donde corre XAMPP/MySQL.
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
      REDIS_PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      target: dev
      context: .
      args:
        - PORT=${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "9229:9229"
    volumes:
      - ./src:/app/src
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512m"
        reservations:
          cpus: "0.25"
          memory: "256m"

  db:
    image: postgres:18
    volumes:
      - ./postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: contraseña
      POSTGRES_DB: booking

  redis:
    image: redis:7.4.1-alpine
    volumes:
      - ./redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: