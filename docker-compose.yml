services:
  my-service-production:
    container_name: my-service-production
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # MySQL externo (XAMPP / host). Ajusta si el host no es accesible así.
      DB_HOST: host.docker.internal
      DB_PORT: 3306
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      target: production
      context: .
      args:
        - PORT=${PORT:-3000}
    ports:
      - "${PRODUCTION_PORT:-3001}:${PORT:-3000}"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512m"
        reservations:
          cpus: "0.25"
          memory: "256m"

  redis:
    image: redis:7.4.1-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
