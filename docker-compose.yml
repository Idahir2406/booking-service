services:
  my-service-production:
    container_name: my-service-production
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - db
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    build:
      target: production
      context: .
      args:
        - PORT=${PORT:-3000}
    ports:
      - "${PRODUCTION_PORT:-3001}:${PORT:-3000}"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512m"
        reservations:
          cpus: "0.25"
          memory: "256m"

  db:
    image: postgres:18
    volumes:
      - ./postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    image: redis:7.4.1-alpine
    ports:
      - 6381:6379
    volumes:
      - ./redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
