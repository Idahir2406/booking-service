services:
  my-service-dev:
    container_name: my-service-dev
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    environment:
      # MariaDB de viajes4patas/web (usuario jefesito). Misma red Docker: web_default.
      DB_HOST: v4p-db
      DB_PORT: 3306
      DB_USERNAME: jefesito
      DB_PASSWORD: loputoamo69
      DB_DATABASE: v4pdb
      DATABASE_URL: mysql://jefesito:loputoamo69@v4p-db:3306/v4pdb
      DATABASE_MIGRATIONS_URL: mysql://jefesito:loputoamo69@v4p-db:3306/v4pdb
      REDIS_HOST: redis
      REDIS_PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      target: dev
      context: .
      args:
        - PORT=${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "9229:9229"
    volumes:
      - ./src:/app/src
    networks:
      - default
      - web_db
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512m"
        reservations:
          cpus: "0.25"
          memory: "256m"

  redis:
    image: redis:7.4.1-alpine
    volumes:
      - ./redis_data:/data
    restart: unless-stopped
    networks:
      - default

networks:
  default:
  web_db:
    external: true
    name: web_default

volumes:
  redis_data:
